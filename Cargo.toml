[workspace]
resolver = "2"
members = ["crates/tc-core", "crates/tc-ratatui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = "0.4"
chrono-tz = "0.10"
hostname = "0.4"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39"
toml = "1"
dirs = "6"
if-addrs = "0.15"
ratatui = "0.30"
crossterm = "0.29"
tc-core = { path = "crates/tc-core" }
